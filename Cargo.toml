[package]
name = "redox_bootloader"
version = "1.0.0"
edition = "2024"

# UEFI uses bin target
[[bin]]
name = "bootloader"
path = "src/main.rs"

# BIOS uses lib target
[lib]
name = "bootloader"
path = "src/main.rs"
crate-type = ["staticlib"]

[dependencies]
bitflags = "1.3.2"

# E-OS V2-MS02: verify the kernel and initfs by signature instead of magic bytes.
# Deliberately the SAME crate and version E-OS already runs on-device in pkg-lib
# (manifest_sig.rs) and host-side in tools/eos-repo-sign -- this adds a third consumer of one
# implementation, not a third implementation, to the trust base. `default-features = false`
# drops std/alloc/zeroize; verification needs no RNG, so nothing pulls getrandom.
ed25519-dalek = { version = "2.2.0", default-features = false, optional = true }
# Comes in with ed25519-dalek anyway (Ed25519 is SHA-512 internally); taking it as a direct
# dependency lets the signed message be a domain-separated digest at zero extra size cost.
sha2 = { version = "0.10", default-features = false, optional = true }
linked_list_allocator = "0.10.5"
log = "0.4.17"
redox_syscall = "0.9"
spin = "0.9.5"

# E-OS R-F10: point at the pinned E-OS fork instead of crates.io. The bootloader is the
# code that UNLOCKS an encrypted root; the filesystem it opens is created and maintained by
# eos-redoxfs. Resolving `redoxfs` from the registry meant those were two different
# codebases inside the TCB -- and the fork carries `--cfg aes_armv8`, so they did not even
# share the same AES path. A `[patch.crates-io]` cannot express this: the fork is 0.9.x and
# the registry requirement was 0.8, which Cargo refuses to patch across. Pin by git+rev, the
# same revision recipes/core/redoxfs is pinned to.
[dependencies.redoxfs]
git = "https://github.com/Gh0s777tt/eos-redoxfs.git"
rev = "555359ef616cedbf00387b9d5a14173270cd2101"
default-features = false
features = ["log"]

[target.'cfg(target_os = "uefi")'.dependencies]
redox_uefi = { git = "https://gitlab.redox-os.org/redox-os/uefi.git" }
redox_uefi_std = { git = "https://gitlab.redox-os.org/redox-os/uefi.git" }

#TODO: riscv cannot use target_os = "uefi" at this time
[target.'cfg(target_arch = "riscv64")'.dependencies]
redox_uefi = { git = "https://gitlab.redox-os.org/redox-os/uefi.git" }
redox_uefi_std = { git = "https://gitlab.redox-os.org/redox-os/uefi.git" }

[target."aarch64-unknown-uefi".dependencies]
dmidecode = "0.8.0"

[target."x86_64-unknown-uefi".dependencies]
x86 = "0.52.0"

[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
byteorder = { version = "1", default-features = false }
fdt = { git = "https://github.com/repnop/fdt.git", rev = "2fb1409edd1877c714a0aa36b6a7c5351004be54" }

[features]
default = []
live = []
serial_debug = []
# E-OS V2-MS02. OFF by default so a keyless build still produces a bootable image, exactly as
# V2-N03's Secure Boot signing degrades. The recipe turns it ON whenever the operator's boot
# key is present, and says so on both paths -- there is no silent state. When it IS on there is
# no runtime bypass: no branch skips verification, and a build with the flag but no usable key
# refuses to boot rather than continuing.
verify-boot = ["dep:ed25519-dalek", "dep:sha2"]

# E-OS V2-MS02: the BIOS stage3 is padded to a hard 384 KiB in asm/x86-unknown-none/
# bootloader.asm, and adding Ed25519 overflows it without LTO (nasm: "TIMES value is
# negative"). LTO + one codegen unit brings the whole bootloader in well under the limit --
# measured to shrink it below its pre-V2-MS02 size on aarch64.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
