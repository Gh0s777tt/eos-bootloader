[package]
name = "redox_bootloader"
version = "1.0.0"
edition = "2024"

# UEFI uses bin target
[[bin]]
name = "bootloader"
path = "src/main.rs"

# BIOS uses lib target
[lib]
name = "bootloader"
path = "src/main.rs"
crate-type = ["staticlib"]

[dependencies]
bitflags = "1.3.2"
linked_list_allocator = "0.10.5"
log = "0.4.17"
redox_syscall = "0.9"
spin = "0.9.5"

# E-OS R-F10: point at the pinned E-OS fork instead of crates.io. The bootloader is the
# code that UNLOCKS an encrypted root; the filesystem it opens is created and maintained by
# eos-redoxfs. Resolving `redoxfs` from the registry meant those were two different
# codebases inside the TCB -- and the fork carries `--cfg aes_armv8`, so they did not even
# share the same AES path. A `[patch.crates-io]` cannot express this: the fork is 0.9.x and
# the registry requirement was 0.8, which Cargo refuses to patch across. Pin by git+rev, the
# same revision recipes/core/redoxfs is pinned to.
[dependencies.redoxfs]
git = "https://github.com/Gh0s777tt/eos-redoxfs.git"
rev = "555359ef616cedbf00387b9d5a14173270cd2101"
default-features = false
features = ["log"]

[target.'cfg(target_os = "uefi")'.dependencies]
redox_uefi = { git = "https://gitlab.redox-os.org/redox-os/uefi.git" }
redox_uefi_std = { git = "https://gitlab.redox-os.org/redox-os/uefi.git" }

#TODO: riscv cannot use target_os = "uefi" at this time
[target.'cfg(target_arch = "riscv64")'.dependencies]
redox_uefi = { git = "https://gitlab.redox-os.org/redox-os/uefi.git" }
redox_uefi_std = { git = "https://gitlab.redox-os.org/redox-os/uefi.git" }

[target."aarch64-unknown-uefi".dependencies]
dmidecode = "0.8.0"

[target."x86_64-unknown-uefi".dependencies]
x86 = "0.52.0"

[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
byteorder = { version = "1", default-features = false }
fdt = { git = "https://github.com/repnop/fdt.git", rev = "2fb1409edd1877c714a0aa36b6a7c5351004be54" }

[features]
default = []
live = []
serial_debug = []
